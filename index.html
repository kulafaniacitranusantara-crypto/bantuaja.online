<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0F1115">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BANTU AJA">
  <meta name="description" content="BANTU AJA — marketplace jasa lokal Kecamatan Lumbir, Banyumas.">
  <title>BANTU AJA — Semua Urusan, Ada Solusinya</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body data-layout="mobile">
  <div id="offline" role="status" aria-live="polite"><i class="bi bi-wifi-off"></i> Anda sedang offline. Sebagian data mungkin tidak terbaru.</div>
  <div id="pbar" aria-hidden="true"></div>

  <!-- Layar muat awal -->
  <div id="boot" role="status" aria-live="polite">
    <span class="logo-mark"><i class="bi bi-hand-thumbs-up-fill"></i></span>
    <div class="brand" style="font-size:22px">BANTU AJA</div>
    <div class="spinner-border" style="color:var(--gold)" aria-hidden="true"></div>
    <div class="small">Memuat aplikasi...</div>
  </div>

  <!-- Sidebar (mitra & admin) -->
  <div id="drawerBack"></div>
  <nav id="sidebar" aria-label="Menu utama"></nav>

  <!-- Kerangka utama SPA: seluruh halaman disuntikkan ke #view -->
  <div id="frame">
    <header id="topbar"></header>
    <main id="view" tabindex="-1" aria-live="polite"></main>
  </div>
  <nav id="bottomnav" aria-label="Navigasi bawah"></nav>

  <!-- Modal serbaguna (formulir, konfirmasi, notifikasi) -->
  <div class="modal fade" id="mdl" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" id="mdlDlg">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title" id="mdlTitle"></h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button></div>
        <div class="modal-body" id="mdlBody"></div>
        <div class="modal-footer" id="mdlFoot"></div>
      </div>
    </div>
  </div>

  <!-- Modal pratinjau berkas (gambar/PDF) -->
  <div class="modal fade" id="pv" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title" id="pvTitle">Pratinjau</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button></div>
        <div class="modal-body" id="pvBody" style="text-align:center"></div>
        <div class="modal-footer">
          <button type="button" class="btn-gh" data-bs-dismiss="modal"><i class="bi bi-x-lg"></i> Tutup</button>
          <a id="pvDl" class="btn-g" download="berkas"><i class="bi bi-download"></i> Unduh</a>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-wrap" id="toasts" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
